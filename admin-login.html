<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin login — Bella Vista</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

	<main class="app-shell" style="margin-top:0; min-height:100vh; display:flex; align-items:center;">
		<div class="wrap">
			<div class="card card--narrow">
				<div class="card__head">
					<h1>Admin login</h1>
					<p>Staff access only — reservations, menu, and customer accounts.</p>
				</div>

				<form id="loginForm" novalidate>
					<div class="field">
						<label for="email">Email</label>
						<input type="email" id="email" name="email" autocomplete="email" required>
					</div>
					<div class="field">
						<label for="password">Password</label>
						<input type="password" id="password" name="password" autocomplete="current-password" required>
					</div>

					<p class="form-error" id="formError" role="alert"></p>

					<button type="submit" class="btn btn--full" id="submitBtn">Log in</button>
				</form>
			</div>
		</div>
	</main>

<script src="app.js"></script>
<script>
	const form = document.getElementById('loginForm');
	const errorEl = document.getElementById('formError');
	const submitBtn = document.getElementById('submitBtn');

	form.addEventListener('submit', async (e) => {
		e.preventDefault();
		errorEl.textContent = '';
		submitBtn.disabled = true;
		submitBtn.textContent = 'Logging in…';

		try{
			const result = await api('/api/admin-login', {
				method: 'POST',
				body: {
					email: document.getElementById('email').value.trim(),
					password: document.getElementById('password').value
				}
			});
			setAdminToken(result.token);
			toast('Logged in.', 'success');
			window.location.href = 'admin.html';
		}catch(err){
			errorEl.textContent = err.message;
			submitBtn.disabled = false;
			submitBtn.textContent = 'Log in';
		}
	});
</script>
</body>
</html>
